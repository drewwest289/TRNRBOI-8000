# Render deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: half-marathon-api
    env: node
    plan: free
    region: oregon

    buildCommand: npm install
    startCommand: node server/index.js

    # Render sets PORT automatically — do not override it here.
    # The server reads process.env.PORT and falls back to 3001 for local dev.
    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Directory for the pending-workout queue file.
      # /tmp persists across restarts but is wiped on redeploy — acceptable
      # for a queue that's meant to be drained within minutes/hours.
      - key: QUEUE_DIR
        value: /tmp

      # Comma-separated list of allowed CORS origins.
      # Set this in the Render dashboard once you know your Cloudflare Pages URL:
      #   https://your-app.pages.dev,http://localhost:5173
      - key: CORS_ORIGINS
        sync: false

      # ── Strava OAuth ────────────────────────────────────────────────────────
      # Set these in the Render dashboard — do NOT commit real values here.
      # Get them from https://www.strava.com/settings/api
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      # Must match "Authorization Callback Domain" on Strava's API settings page.
      # Set to the full callback URL of this service, e.g.:
      #   https://half-marathon-api.onrender.com/auth/strava/callback
      - key: STRAVA_REDIRECT_URI
        sync: false

      # ── Strava token persistence ────────────────────────────────────────────
      # After OAuth completes, the server writes tokens back to these env vars
      # via the Render API so they survive redeploys. Without these, you must
      # re-authorize at /auth/strava after every deploy.
      #
      # RENDER_API_KEY:   Render dashboard → Account Settings → API Keys → Create
      # RENDER_SERVICE_ID: the srv-xxxxx ID shown in your service URL
      #
      # STRAVA_ACCESS_TOKEN / STRAVA_REFRESH_TOKEN / STRAVA_TOKEN_EXPIRES_AT
      # are written automatically after OAuth — do not set them by hand.
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_SERVICE_ID
        sync: false
      # The three below are managed automatically by the server — do not set manually.
      - key: STRAVA_ACCESS_TOKEN
        sync: false
      - key: STRAVA_REFRESH_TOKEN
        sync: false
      - key: STRAVA_TOKEN_EXPIRES_AT
        sync: false
